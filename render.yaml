services:
  # Backend API
  - type: web
    name: mock-interview-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: AI_SERVICE_URL
        value: https://mock-interview-ai-service.onrender.com
      - key: FILE_UPLOAD_MAX_SIZE
        value: 5242880
      - key: UPLOAD_STORAGE_TYPE
        value: local
      - key: CORS_ORIGIN
        value: https://mock-interview-frontend.onrender.com
    autoDeploy: true

  # AI Service
  - type: web
    name: mock-interview-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4-turbo
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_WORKERS
        value: 2
      - key: LOG_LEVEL
        value: INFO
    autoDeploy: true
